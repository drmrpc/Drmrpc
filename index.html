<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows XP Emulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background: #000;
            font-family: 'MS Sans Serif', Arial, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(90deg, #0078d4 0%, #1084d7 100%);
            color: #fff;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 2px solid #dfdfdf;
            user-select: none;
        }

        .container {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        #screen {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #0078d4;
            font-size: 18px;
            font-weight: bold;
            z-index: 100;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #dfdfdf;
            border-top-color: #0078d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            background: #dfdfdf;
            border-top: 1px solid #dfdfdf;
            padding: 4px 8px;
            font-size: 11px;
            color: #000;
            text-align: center;
        }

        .error {
            color: #c00;
            padding: 20px;
            text-align: center;
            background: #fff;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">Windows XP Emulator - v86</div>
    
    <div class="container">
        <div class="loading" id="loading">
            <div>Starting Windows XP...</div>
            <div class="spinner"></div>
            <div style="margin-top: 20px; font-size: 12px; color: #666;">This may take 30-60 seconds</div>
        </div>
        <canvas id="screen"></canvas>
    </div>
    
    <div class="footer">
        <span id="status">Initializing emulator...</span>
    </div>

    <script src="build/v86.js"></script>
    <script>
        'use strict';

        const V86_URL = window.location.origin;
        const statusEl = document.getElementById('status');
        const loadingEl = document.getElementById('loading');

        let emulator;

        try {
            emulator = new V86({
                screen_container: document.getElementById('screen'),
                bios: {
                    url: V86_URL + '/bios/seabios.bin',
                },
                vga_bios: {
                    url: V86_URL + '/bios/vgabios.bin',
                },
                hda: {
                    url: V86_URL + '/images/windows_xp.img',
                },
                autostart: true,
                memory_size: 512 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
            });

            emulator.add_listener('emulator-ready', function() {
                loadingEl.style.display = 'none';
                statusEl.textContent = '✓ Windows XP is running';
            });

            emulator.add_listener('emulator-stopped', function() {
                statusEl.textContent = '⊗ Emulator stopped';
            });

            // Show boot progress
            let bootTime = 0;
            const bootInterval = setInterval(() => {
                bootTime++;
                if (bootTime > 120) {
                    clearInterval(bootInterval);
                }
                statusEl.textContent = `Booting... ${bootTime}s`;
            }, 1000);

            emulator.add_listener('emulator-ready', function() {
                clearInterval(bootInterval);
            });

        } catch (error) {
            console.error('Emulator error:', error);
            loadingEl.innerHTML = `
                <div class="error">
                    <strong>Error starting emulator:</strong><br>
                    ${error.message}<br><br>
                    <small>Make sure all required files are available:<br>
                    - /bios/seabios.bin<br>
                    - /bios/vgabios.bin<br>
                    - /images/windows_xp.img
                    </small>
                </div>
            `;
            statusEl.textContent = '✗ Failed to start emulator';
        }

        // Handle keyboard
        window.addEventListener('keydown', (e) => {
            if (emulator && emulator.keyboard_send_scancodes) {
                // Let v86 handle it
            }
        });
    </script>
</body>
</html>
