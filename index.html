<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Windows XP</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background: #0078d4;
            font-family: 'MS Sans Serif', 'Tahoma', Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #008fe7 0%, #0078d4 100%);
            position: relative;
            overflow: hidden;
        }

        #screen {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            border: 2px solid #dfdfdf;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            z-index: 100;
            background: rgba(0, 0, 0, 0.3);
            padding: 40px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            z-index: 50;
            min-width: 200px;
            text-align: center;
        }

        .error {
            background: rgba(200, 0, 0, 0.8);
            color: #fff;
            padding: 20px;
            text-align: center;
            border-radius: 4px;
            max-width: 500px;
        }

        .keyboard-hint {
            position: fixed;
            top: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 3px;
            z-index: 40;
        }
    </style>
</head>
<body>
    <div class="keyboard-hint">Click to focus • Right-click for menu • Ctrl+Alt+Del to reboot</div>
    
    <div class="container">
        <div class="loading" id="loading">
            <div>🔄 Starting Windows XP...</div>
            <div class="spinner"></div>
            <div style="margin-top: 20px; font-size: 14px; color: #ddd;">This may take 1-2 minutes</div>
        </div>
        <canvas id="screen"></canvas>
    </div>
    
    <div class="status" id="status">Initializing...</div>

    <script src="build/v86.js"></script>
    <script>
        'use strict';

        const V86_URL = window.location.origin;
        const statusEl = document.getElementById('status');
        const loadingEl = document.getElementById('loading');
        const screenEl = document.getElementById('screen');

        let emulator;
        let bootStartTime = Date.now();

        try {
            emulator = new V86({
                screen_container: screenEl,
                bios: {
                    url: V86_URL + '/bios/seabios.bin',
                },
                vga_bios: {
                    url: V86_URL + '/bios/vgabios.bin',
                },
                hda: {
                    url: V86_URL + '/images/windows_xp.img',
                },
                autostart: true,
                memory_size: 512 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                
                // Enable audio (Web Audio API)
                audio_adapter: function() {
                    return new AudioContext();
                },
                
                // Enable networking (user mode networking)
                network_adapter: new V86Starter.NetworkAdapter(V86Starter.IPADDRESS),
                
                // Enable mouse and keyboard
                keyboard_adapter: new V86Starter.KeyboardAdapter(),
            });

            // Boot progress
            let bootTime = 0;
            const bootInterval = setInterval(() => {
                bootTime++;
                const elapsed = ((Date.now() - bootStartTime) / 1000).toFixed(1);
                statusEl.textContent = `⏱️ Booting... ${elapsed}s`;
                
                if (bootTime > 180) clearInterval(bootInterval);
            }, 1000);

            emulator.add_listener('emulator-ready', function() {
                clearInterval(bootInterval);
                loadingEl.style.display = 'none';
                statusEl.textContent = '✓ Windows XP Ready | Audio: Enabled | Network: Enabled';
                console.log('Windows XP emulator ready!');
            });

            emulator.add_listener('emulator-stopped', function() {
                statusEl.textContent = '⊗ Emulator Stopped';
            });

            // Handle fullscreen
            screenEl.addEventListener('dblclick', () => {
                if (screenEl.requestFullscreen) {
                    screenEl.requestFullscreen();
                }
            });

        } catch (error) {
            console.error('Emulator error:', error);
            loadingEl.innerHTML = `
                <div class="error">
                    <strong>❌ Error starting emulator</strong><br><br>
                    ${error.message}<br><br>
                    <small>Required files:<br>
                    ✓ /bios/seabios.bin<br>
                    ✓ /bios/vgabios.bin<br>
                    ✓ /images/windows_xp.img
                    </small>
                </div>
            `;
            statusEl.textContent = '⊗ Failed to start';
        }

        // Prevent accidental navigation
        window.addEventListener('beforeunload', (e) => {
            e.preventDefault();
            return false;
        });
    </script>
</body>
</html>
