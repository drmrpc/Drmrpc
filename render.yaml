services:
  - type: web
    name: neko-vdesktop
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    
    # Expose port 8080
    ports:
      - port: 8080
        protocol: http
    
    # Environment variables for n.eko configuration
    envVars:
      - key: NEKO_SCREEN
        value: "720x1280@30"
      - key: NEKO_ICELITE
        value: "true"
      - key: NEKO_PASSWORD
        value: changeme123
      - key: NEKO_PASSWORD_ADMIN
        value: adminpass456
      - key: NEKO_FILE_TRANSFER_TIMEOUT
        value: "60"
      - key: NEKO_LOCKS
        value: "control,login"
